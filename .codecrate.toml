[codecrate]
output = "context_covledger.md"
keep_docstrings = true
dedupe = true
respect_gitignore = true
# exclude = ["*/.venv/*", "integration_tests", "examples", "docs"]
gitignore_allow = ["covledger/_version.py"]
exclude = [
  "*/.venv/*",
  "todo.md",
  "run.html",
  "pi-session-*.html",
  "*-session-*.html",
  ".pytest_cache/*",
  ".ruff_cache/*",
  ".mypy_cache/*",
]
include = ["**/*.py", "**/*.toml", "**/*.rst", "**/*.md", "**/*.typed", "**/*.js", "**/*.css", "**/*.html", "**/*.conf"]
split_max_chars = 0
manifest = false
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
